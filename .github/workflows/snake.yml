name: Generate Snake 🐍

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=FF0000&color_dots=#0d1117,#1a0000,#4d0000,#990000,#FF0000
            dist/github-snake-dark.svg?color_snake=FF0000&color_dots=#0d1117,#1a0000,#4d0000,#990000,#FF0000

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
